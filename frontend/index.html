<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>TestVerse — Plataforma de automatización de pruebas</title>
    <meta
      name="description"
      content="Plataforma interna de QA que graba y reproduce pruebas E2E, de UI y de API con Playwright sobre el ERP SINCO/ADPRO para automatizar calidad del software."
    />

    <!-- Theme color (matches the dark UI theme) -->
    <meta name="theme-color" content="#0F172A" />

    <!-- Icons (testverse-icon.png lives in public/ and is copied to the build root) -->
    <link rel="icon" type="image/png" href="/testverse-icon.png" />
    <link rel="apple-touch-icon" href="/testverse-icon.png" />

    <!-- ===================================================================
         PLACEHOLDER DOMAIN: replace every "https://testverse.com" below with
         the real public URL of the deployed landing page before go-live.
         Also replace /og.png with a real 1200x630 social preview image.
         =================================================================== -->

    <!-- Canonical -->
    <link rel="canonical" href="https://testverse.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TestVerse — Plataforma de automatización de pruebas" />
    <meta
      property="og:description"
      content="Plataforma interna de QA que graba y reproduce pruebas E2E, de UI y de API con Playwright sobre el ERP SINCO/ADPRO para automatizar calidad del software."
    />
    <meta property="og:url" content="https://testverse.com/" />
    <!-- og:image must be an ABSOLUTE URL (1200x630). Replace with real image. -->
    <meta property="og:image" content="https://testverse.com/og.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TestVerse — Plataforma de automatización de pruebas" />
    <meta
      name="twitter:description"
      content="Plataforma interna de QA que graba y reproduce pruebas E2E, de UI y de API con Playwright sobre el ERP SINCO/ADPRO para automatizar calidad del software."
    />
    <!-- Replace with real absolute image URL. -->
    <meta name="twitter:image" content="https://testverse.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
